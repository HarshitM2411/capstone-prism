server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The console talks to the gateway's admin API through its own origin.
  location /admin/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}